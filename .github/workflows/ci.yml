name: source-and-safety
on: [push, pull_request]
jobs:
  checks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Stdlib safety tests (no ASR weights)
        run: python3 -B -m unittest discover -s tests -v
      - name: Source privacy guard
        run: python3 -B scripts/privacy_guard.py --all
